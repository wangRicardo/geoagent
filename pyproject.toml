[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoagent-ml"
version = "0.5.0"
description = "Ricardo Agent — a personal AI agent for geophysics & machine learning research — 地球物理 × 机器学习个人研究 Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wangRicardo" }]
keywords = ["ricardo-agent", "geophysics", "machine-learning", "agent", "seismic", "well-logging", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3", "scipy>=1.10"]
data = ["obspy>=1.4", "requests>=2.28"]
plot = ["matplotlib>=3.7"]
seismic = ["segyio>=1.9"]
well = ["lasio>=0.31"]
llm = ["openai>=1.0"]
all = ["scikit-learn>=1.3", "scipy>=1.10", "segyio>=1.9", "lasio>=0.31", "openai>=1.0", "matplotlib>=3.7", "obspy>=1.4", "requests>=2.28"]
dev = ["pytest>=7"]

[project.scripts]
ricardo = "geoagent.cli:main"
ricardo-gui = "geoagent.gui:launch"
geoagent = "geoagent.cli:main"

[project.urls]
Homepage = "https://wangricardo.github.io/geoagent/"
Repository = "https://github.com/wangRicardo/geoagent"

[tool.setuptools.packages.find]
include = ["geoagent*"]
